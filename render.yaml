services:
  - type: web
    name: chua-online
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
